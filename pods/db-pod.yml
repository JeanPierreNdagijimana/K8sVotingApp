# Pod definition demo

apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    app: db
spec:
  containers:
    -  name: postgres
       image: postgres:15-alpine
       env:
         - name: POSTGRES_PASSWORD
           value: "postgres"
         - name: POSTGRES_USER
           value: "postgres"
       ports:
         - containerPort: 5432
           name: postgres
        
